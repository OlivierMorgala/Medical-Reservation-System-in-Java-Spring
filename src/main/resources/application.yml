spring:
  application:
    name: medical-reservation-system

  datasource:
    url: jdbc:postgresql://localhost:5432/mrs-db
    username: local-user-mrs
    password: local-password-mrs
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enabled: false